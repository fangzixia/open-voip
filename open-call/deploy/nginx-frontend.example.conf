# Nginx 托管前端静态站（与 API 分离）

# 构建：cd open-call-web && npm run build
# 将 dist/ 部署到 /var/www/open-voip-ui

server {
    listen 443 ssl http2;
    server_name ui.cc.internal;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    root /var/www/open-voip-ui;
    index index.html;

    location /guest/ {
        try_files $uri $uri/ /guest/index.html;
    }
    location = /agent { return 302 /; }
    location /agent/ {
        return 302 /;
    }
    location = /admin { return 302 /; }
    location /admin/ {
        return 302 /;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
