# open-call 配置示例（呼叫中心：/api/v1 + BFF → open-switch /switch/v1）
# CC↔Switch 无鉴权；事件 callback URL 由 Switch 侧配置。

server:
  # 对浏览器/坐席客户端暴露的 API（含 WebSocket）。
  listen: "0.0.0.0:8080"

integration:
  switch_base_url: "http://127.0.0.1:8082"

database:
  # 业务库：用户/坐席/队列/CDR 元数据等；勿与 open-switch 话务库混用。
  dsn: "host=127.0.0.1 user=openvoip password=change_me dbname=openvoip_call port=5432 sslmode=disable"

# 启动时校验必须可用；为空则从 PATH 查找 ffmpeg。IVR TTS 等转码均使用此路径。
ffmpeg_path: ""

recordings:
  # 录音元数据与策略；文件实体在 open-switch 的 recordings.audio.dir / recordings.video.dir。
  retain_days: 90
  notify_message: "本通话可能会被录音或录像，继续即表示您已知悉。"

# IVR 素材文本转语音（业务侧）。合成后由 open-call 上传 WAV 至 Switch，Switch 只存文件。
tts:
  enabled: false
  provider: aliyun
  sample_rate: 16000
  max_text_chars: 2000
  aliyun:
    access_key_id: ""
    access_key_secret: ""
    app_key: ""
    voice: xiaoyun
    format: wav
  xunfei:
    app_id: ""
    api_key: ""
    api_secret: ""
    voice: xiaoyan
    aue: lame
  openai_compatible:
    base_url: "https://api.openai.com"
    api_key: ""
    model: gpt-4o-mini-tts
    voice: alloy
    response_format: mp3

# 虚拟坐席 Worker：AI 呼入（WebRTC + Realtime）与语音通知放音（WebRTC）。
# 语音通知 API 的 agent_id 须与本节 agent_id 一致（媒体服务账号）。
aibot:
  enabled: false
  username: "ai-bot"
  password: "REPLACE-AIBOT-PASSWORD-12+"
  agent_id: ""
  queue_ids: []
  system_prompt: "你是呼叫中心智能助手，简洁友好地解答用户问题；需要人工时说转人工。"
  openai_realtime:
    # provider: qwen 时使用 DashScope 头；openai 时使用 OpenAI-Beta。
    provider: ""
    # 兼容 OpenAI Realtime 协议的网关根地址（https 或 wss）；无默认值，请填写自有或代理地址。
    # 通义示例：wss://maas.qianwenaiapi.com/api-ws/v1/realtime
    base_url: ""
    api_key: ""
    model: "gpt-4o-realtime-preview"
    voice: "alloy"

jwt:
  access_ttl_sec: 3600
  refresh_ttl_sec: 604800
  # 示例仅用于通过配置校验，部署前必须替换为随机生成的密钥。
  signing_key: "example-only-32-byte-signing-key-change-me"

# 启用后员工只通过 OIDC 登录；emergency_admin 是唯一保留密码登录的账号。
oidc:
  enabled: false
  issuer: "https://id.example.com/realms/contact-center"
  client_id: "open-voip"
  client_secret: "REPLACE_WITH_CLIENT_SECRET"
  redirect_url: "https://cc.example.com/api/v1/auth/oidc/callback"
  frontend_url: "https://cc.example.com"
  groups_claim: "groups"
  scopes: ["openid", "profile", "offline_access"]
  emergency_admin: "admin"
  encryption_key: "REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS"

log:
  level: info
  format: json
  dir: "./logs/open-call"
  max_size_mb: 100
  max_age_days: 0

tls:
  enabled: false
  cert_file: ""
  key_file: ""

webhook:
  max_retries: 8
  timeout_sec: 5

public:
  guest_base_url: "https://cc.example.com/guest"
  allow_direct_join: false

bootstrap:
  enabled: true
  admin_password: "REPLACE-ADMIN-PASSWORD-12+"
  agent_password: "REPLACE-AGENT-PASSWORD-12+"

security:
  allowed_origins:
    - "*"
