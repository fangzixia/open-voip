name: CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openvoip
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: openvoip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openvoip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Go test
        env:
          OPEN_VOIP_TEST_DSN: "host=127.0.0.1 user=openvoip password=change_me dbname=openvoip port=5432 sslmode=disable"
        run: |
          go mod download
          go vet ./...
          go test ./...
          go build -o /dev/null ./cmd/open-voip
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: app

  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @redocly/cli@1 lint docs/api/openapi.yaml --config docs/api/redocly.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm ci
          npm run build
