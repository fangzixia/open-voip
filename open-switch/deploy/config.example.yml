# open-switch 配置示例（软交换：Switch API + 媒体/SIP）
# 事件通过 integration.events_callback_url 推送给业务系统；无多租户登记。

server:
  listen: "127.0.0.1:8082"

integration:
  events_callback_url: "http://127.0.0.1:8080/api/v1/integration/switch/events"

database:
  dsn: "host=127.0.0.1 user=openvoip password=change_me dbname=openvoip_switch port=5432 sslmode=disable"

recordings:
  audio:
    dir: "./data/recordings/audio"
    notify_message: "本通话可能会被录音，继续即表示您已知悉。"
  video:
    dir: "./data/recordings/video"
    format: "webm"
    ffmpeg_path: ""
    notify_message: "本通话可能会被录像，继续即表示您已知悉。"

log:
  level: info
  format: json
  dir: "./logs/open-switch"
  max_size_mb: 100

tls:
  enabled: false
  cert_file: ""
  key_file: ""

ice:
  stun_urls: []
  udp_port_min: 10000
  udp_port_max: 20000

turn:
  enabled: false
  urls: []
  auth_secret: ""

sip:
  enabled: false
  listen: "0.0.0.0:5060"
  user_agent: "open-switch"
  local_domain: ""
  external_ip: "127.0.0.1"
  rtp_port_min: 20002
  rtp_port_max: 20100
  transport: udp
  session_expires_sec: 0
  local_registrar: false
  devices: []
  # devices:
  #   - username: "1001"
  #     password: "REPLACE-WITH-UNIQUE-RANDOM-PASSWORD"
  #     allowed_cidrs: ["192.168.10.0/24"]
  tls_cert_file: ""
  tls_key_file: ""
  prefer_wideband: false
  preferred_codecs:
    - G722
    - PCMA
    - PCMU
  # gateway_device: "100163800"  # 模组注册名；PSTN 外呼走网关（无 trunk 时自动）
  trunks: []

# 排队接听：主叫侧等待音与坐席媒体接通的平滑过渡
media:
  queue_answer_grace_ms: 500
  queue_answer_fade_ms: 150
