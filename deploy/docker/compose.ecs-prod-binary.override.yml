# Bind-mount production binaries so container matches systemd bits (DB/config compatible).
# Use: docker compose -f compose.yml -f deploy/docker/compose.ecs-prod-binary.override.yml up -d
services:
  open-switch:
    volumes:
      - type: bind
        source: /opt/open-switch/open-switch
        target: /usr/local/bin/open-switch
        read_only: true
  open-call:
    volumes:
      - type: bind
        source: /opt/open-call/open-call
        target: /usr/local/bin/open-call
        read_only: true
