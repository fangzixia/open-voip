# Open VoIP — Nginx 示例（HTTP，公网 IP 或域名）
# 安装：cp deploy/nginx/open-voip.conf /etc/nginx/conf.d/open-voip.conf && nginx -t && systemctl reload nginx
#
# 前提：open-call 监听 127.0.0.1:8080；静态文件在 /var/www/open-call-web

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name 8.153.98.134 _;

    client_max_body_size 64m;

    root /var/www/open-call-web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /favicon.ico =404;
    }

    location = /favicon.svg {
        access_log off;
        default_type image/svg+xml;
        try_files /favicon.svg =404;
    }

    location /guest/ {
        try_files $uri $uri/ /guest/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
