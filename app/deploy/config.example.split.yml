# API 独立部署示例：不托管前端静态资源，仅 REST + WebSocket + 媒体信令。
# 前端构建见 app/frontend：npm run build:split，由 Nginx 托管 deploy/nginx-frontend.example.conf

server:
  listen: "0.0.0.0:8080"
  # public_url 为 API 对外地址（WebRTC/ICE 文档以此为准），与 UI 域名可不同
  public_url: "https://api.cc.internal"

database:
  dsn: "host=127.0.0.1 user=openvoip password=change_me dbname=openvoip port=5432 sslmode=disable"

recordings:
  dir: "./data/recordings"

jwt:
  access_ttl_sec: 3600
  refresh_ttl_sec: 604800
  signing_key: "replace-with-long-random-secret"

log:
  level: info
  format: json

tls:
  enabled: false
  cert_file: ""
  key_file: ""

static:
  dir: "./static"

ice:
  stun_urls:
    - "stun:stun.l.google.com:19302"

turn:
  enabled: false
  urls: []
  auth_secret: ""

static_serve: false

cors:
  allowed_origins:
    - "https://ui.cc.internal"
    # Vite 本地调试 UI、API 分离时可临时加入：
    # - "http://127.0.0.1:5173"
