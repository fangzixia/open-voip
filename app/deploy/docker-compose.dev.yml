# 本地开发用 PostgreSQL，非生产交付物。启动：docker compose -f app/deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openvoip
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: openvoip
    ports:
      - "5432:5432"
    volumes:
      - open_voip_pg:/var/lib/postgresql/data

volumes:
  open_voip_pg:
