# 前端静态站点示例（与 open-voip API 分机部署）。
# 构建：cd app/frontend && npm run build:split
# 将 dist/ 内容部署到 /var/www/open-voip-ui

server {
    listen 443 ssl http2;
    server_name ui.cc.internal;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    root /var/www/open-voip-ui;
    index index.html;

    location /agent/ {
        try_files $uri $uri/ /agent/index.html;
    }
    location /guest/ {
        try_files $uri $uri/ /guest/index.html;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location = / {
        return 302 /agent/;
    }
}
