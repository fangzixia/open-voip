# Optional for local dev only (Postgres in Docker). ECS production uses host Postgres + config.yml DSN; do not use this file on ECS.
services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    network_mode: host
    command: [postgres, -c, listen_addresses=127.0.0.1, -p, "${DATABASE_PORT:-15432}"]
    environment:
      POSTGRES_USER: openvoip
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/init-databases.sql:/docker-entrypoint-initdb.d/10-open-voip.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -p ${DATABASE_PORT:-15432} -U openvoip -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  open-switch:
    depends_on:
      postgres:
        condition: service_healthy
  open-call:
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  postgres_password:
    file: ${RUNTIME_DIR:-./runtime}/secrets/postgres_password

volumes:
  postgres-data:
