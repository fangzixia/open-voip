openapi: 3.1.0
info:
  title: Open VoIP API
  version: 1.0.0
  description: |
    内网呼叫中心 REST API。WebSocket 见 ../events.md。
    需求 ID 见各 operation 的 x-requirement-id。
  license:
    name: Proprietary

servers:
  - url: https://cc.internal
    description: 内网示例

tags:
  - name: Auth
  - name: Users
  - name: Agents
  - name: Queues
  - name: Skills
  - name: IVR
  - name: Guest
  - name: Calls
  - name: MediaSignaling
  - name: CDR
  - name: Recordings
  - name: Reports
  - name: Webhooks
  - name: Config
  - name: Audit
  - name: Supervisor
  - name: Platform
  - name: AdminMaintenance

security:
  - bearerAuth: []

paths:
  /api/v1/agents/me/calls:
    get:
      tags: [Agents]
      summary: 当前坐席活跃通话快照（重连恢复）
      operationId: getMyActiveCalls
      responses:
        "200":
          description: items 中包含当前坐席所属的活跃通话
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
        "403":
          description: 当前用户不是坐席
  /health:
    get:
      tags: [Platform]
      security: []
      summary: 存活探针
      x-requirement-id: PLAT-06
      responses:
        "200":
          description: OK

  /health/ready:
    get:
      tags: [Platform]
      security: []
      summary: 就绪探针，检查 PostgreSQL 与 open-switch
      responses:
        "200":
          description: 依赖均可用
        "503":
          description: 至少一个关键依赖不可用

  /api/v1/status:
    get:
      tags: [Platform]
      summary: 运行状态摘要
      x-requirement-id: PLAT-06,DEPLOY-08
      x-roles: [admin, supervisor]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 登录
      x-requirement-id: PLAT-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: 刷新 access token
      x-requirement-id: PLAT-02
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 登出并撤销
      x-requirement-id: PLAT-02
      responses:
        "204":
          description: No content

  /api/v1/users:
    get:
      tags: [Users]
      summary: 用户列表
      x-requirement-id: ADM-01
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
    post:
      tags: [Users]
      summary: 创建用户
      x-requirement-id: ADM-01,AGENT-01
      x-roles: [admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      x-roles: [admin]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags: [Users]
      x-roles: [admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      tags: [Users]
      x-roles: [admin]
      responses:
        "204":
          description: Deleted

  /api/v1/users/{userId}/reset-password:
    post:
      tags: [Users]
      x-requirement-id: AGENT-01
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 新临时密码或邮件流程（实现定义）

  /api/v1/agents/me:
    get:
      tags: [Agents]
      summary: 当前坐席资料
      x-roles: [agent, supervisor, admin]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /api/v1/agents:
    get:
      tags: [Agents]
      summary: 坐席目录（转接/外呼）
      x-roles: [agent, supervisor, admin]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"

  /api/v1/agents/{agentId}/skills:
    get:
      tags: [Skills]
      x-requirement-id: AGENT-06
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: OK
    put:
      tags: [Skills]
      x-requirement-id: AGENT-06
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skill_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK

  /api/v1/agents/{agentId}/check-in:
    post:
      tags: [Agents]
      summary: 签入队列
      x-requirement-id: AGENT-02
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                queue_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"

  /api/v1/agents/{agentId}/check-out:
    post:
      tags: [Agents]
      x-requirement-id: AGENT-02
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "204":
          description: OK

  /api/v1/agents/{agentId}/state:
    put:
      tags: [Agents]
      summary: 设置示闲/示忙等
      x-requirement-id: AGENT-03,AGENT-04
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentStateUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"

  /api/v1/queues:
    get:
      tags: [Queues]
      x-requirement-id: ADM-01,QUEUE-01
      x-roles: [admin, supervisor]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueList"
    post:
      tags: [Queues]
      x-roles: [admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"

  /api/v1/queues/{queueId}:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    get:
      tags: [Queues]
      x-roles: [admin, supervisor, agent]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
    patch:
      tags: [Queues]
      x-roles: [admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
    delete:
      tags: [Queues]
      x-roles: [admin]
      responses:
        "204":
          description: Deleted

  /api/v1/queues/{queueId}/agents:
    put:
      tags: [Queues]
      summary: 绑定坐席
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/QueueId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK

  /api/v1/skills:
    get:
      tags: [Skills]
      x-requirement-id: AGENT-06,ADM-01
      x-roles: [admin]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      tags: [Skills]
      x-roles: [admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /api/v1/ivr/flows:
    get:
      tags: [IVR]
      x-requirement-id: ADM-02
      x-roles: [admin]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IVRFlow"
    post:
      tags: [IVR]
      x-roles: [admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IVRFlowCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IVRFlow"

  /api/v1/ivr/flows/{flowId}/publish:
    post:
      tags: [IVR]
      summary: 发布 IVR 快照
      x-requirement-id: ADM-04,IVR-01
      x-roles: [admin]
      parameters:
        - name: flowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IVRPublishedSnapshot"

  /api/v1/guest/sessions:
    post:
      tags: [Guest]
      summary: 创建访客入会 token
      x-requirement-id: ADM-05
      x-roles: [admin, agent]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSessionCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSession"

  /api/v1/guest/queues:
    get:
      tags: [Guest]
      summary: Demo 公开队列列表
      x-requirement-id: UI-C-01
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GuestQueue"

  /api/v1/guest/join:
    post:
      tags: [Guest]
      summary: Demo 直链入队并创建呼入
      x-requirement-id: QUEUE-03,UI-C-01
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestJoinRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestJoinResponse"

  /api/v1/calls/outbound:
    post:
      tags: [Calls]
      summary: 外呼
      x-requirement-id: CALL-01,MEDIA-09
      x-roles: [agent]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundCallRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

  /api/v1/calls/{callId}/answer:
    post:
      tags: [Calls]
      x-requirement-id: QUEUE-03
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

  /api/v1/calls/{callId}/hangup:
    post:
      tags: [Calls]
      x-roles: [agent, supervisor]
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "204":
          description: OK

  /api/v1/calls/{callId}/hold:
    post:
      tags: [Calls]
      x-requirement-id: MEDIA-05
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                on:
                  type: boolean
      responses:
        "200":
          description: OK

  /api/v1/calls/{callId}/transfer:
    post:
      tags: [Calls]
      x-requirement-id: CALL-02,VIDEO-09
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: OK
        "422":
          $ref: "#/components/responses/BusinessError"

  /api/v1/calls/{callId}/transfer/complete:
    post:
      tags: [Calls]
      summary: 完成咨询转
      x-requirement-id: CALL-02
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "200":
          description: OK
        "409":
          $ref: "#/components/responses/BusinessError"

  /api/v1/calls/{callId}/video/request:
    post:
      tags: [Calls]
      x-requirement-id: VIDEO-06
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "202":
          description: 已通知对端

  /api/v1/calls/{callId}:
    get:
      tags: [Calls]
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

  /api/v1/calls/{callId}/decline:
    post:
      tags: [Calls]
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "204":
          description: OK

  /api/v1/calls/{callId}/video/respond:
    post:
      tags: [Calls]
      x-requirement-id: VIDEO-06
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accept:
                  type: boolean
      responses:
        "200":
          description: OK

  /api/v1/calls/{callId}/video/downgrade:
    post:
      tags: [Calls]
      x-requirement-id: VIDEO-07
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "200":
          description: OK

  /api/v1/calls/{callId}/screen-share:
    post:
      tags: [Calls]
      x-requirement-id: VIDEO-08
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                on:
                  type: boolean
                leg_id:
                  type: string
      responses:
        "200":
          description: OK

  /api/v1/calls/{callId}/conference:
    post:
      tags: [Calls]
      x-requirement-id: CALL-03
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
      responses:
        "200":
          description: OK

  /api/v1/calls/{callId}/dtmf:
    post:
      tags: [Calls]
      x-requirement-id: MEDIA-06
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                leg_id:
                  type: string
                digit:
                  type: string
      responses:
        "200":
          description: OK

  /api/v1/calls/{callId}/wrap-up:
    post:
      tags: [Calls]
      x-requirement-id: UI-A-07
      x-roles: [agent]
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                text:
                  type: string
                disposition_code:
                  type: string
                tags:
                  type: array
                  items: {type: string}
                complete:
                  type: boolean
                  description: 完成 ACW 后将坐席恢复为空闲
      responses:
        "201":
          description: Created

  /api/v1/wrap-ups:
    get:
      tags: [Calls]
      summary: 查询通话小结
      x-requirement-id: UI-A-07
      x-roles: [admin, supervisor]
      parameters:
        - name: call_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK

  /api/v1/calls/{callId}/qa-marks:
    get:
      tags: [Recordings]
      x-requirement-id: QA-01
      x-roles: [admin, supervisor]
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "200":
          description: OK
    post:
      tags: [Recordings]
      x-requirement-id: QA-01
      x-roles: [admin, supervisor]
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                offset_sec:
                  type: integer
                label:
                  type: string
                score:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        "201":
          description: Created

  /api/v1/calls/{callId}/qa-marks/{markId}:
    patch:
      tags: [Recordings]
      x-roles: [admin, supervisor]
      parameters:
        - $ref: "#/components/parameters/CallId"
        - name: markId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offset_sec, label]
              properties:
                offset_sec: {type: integer, minimum: 0}
                label: {type: string}
                score: {type: integer, minimum: 0, maximum: 100}
      responses:
        "200": {description: Updated}
    delete:
      tags: [Recordings]
      x-roles: [admin, supervisor]
      parameters:
        - $ref: "#/components/parameters/CallId"
        - name: markId
          in: path
          required: true
          schema: {type: string}
      responses:
        "204": {description: Deleted}

  /api/v1/calls/{callId}/legs/{legId}/mute:
    post:
      tags: [MediaSignaling]
      x-requirement-id: MEDIA-05
      parameters:
        - $ref: "#/components/parameters/CallId"
        - $ref: "#/components/parameters/LegId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                audio:
                  type: boolean
                video:
                  type: boolean
      responses:
        "200":
          description: OK

  /api/v1/calls/{callId}/legs/{legId}/offer:
    post:
      tags: [MediaSignaling]
      summary: 提交 SDP Offer 或获取 Offer
      x-requirement-id: MEDIA-01,VIDEO-01
      parameters:
        - $ref: "#/components/parameters/CallId"
        - $ref: "#/components/parameters/LegId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SDPPayload"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SDPPayload"

  /api/v1/calls/{callId}/legs/{legId}/answer:
    post:
      tags: [MediaSignaling]
      parameters:
        - $ref: "#/components/parameters/CallId"
        - $ref: "#/components/parameters/LegId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SDPPayload"
      responses:
        "200":
          description: OK

  /api/v1/calls/{callId}/legs/{legId}/ice:
    post:
      tags: [MediaSignaling]
      x-requirement-id: MEDIA-04
      parameters:
        - $ref: "#/components/parameters/CallId"
        - $ref: "#/components/parameters/LegId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ICECandidate"
      responses:
        "204":
          description: OK

  /api/v1/calls/{callId}/turn-credentials:
    get:
      tags: [MediaSignaling]
      x-requirement-id: VIDEO-12,MEDIA-04b
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TURNCredentials"

  /api/v1/cdr:
    get:
      tags: [CDR]
      x-requirement-id: CDR-01,ADM-03
      x-roles: [admin, supervisor]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: queue_id
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CDRList"

  /api/v1/cdr/export.csv:
    get:
      tags: [CDR]
      x-requirement-id: CDR-03
      x-roles: [admin]
      parameters:
        - name: from
