components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    QueueId:
      name: queueId
      in: path
      required: true
      schema:
        type: string
    CallId:
      name: callId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LegId:
      name: legId
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BusinessError:
      description: 业务错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required:
        - code
        - message
        - data
        - request_id
        - error
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        request_id:
          type: string
        error:
          type: string
          description: 错误分类；兼容旧版客户端

    StatusResponse:
      type: object
      properties:
        db_ok:
          type: boolean
        active_calls:
          type: integer
        ws_connections:
          type: integer
        goroutines:
          type: integer
        heap_alloc_bytes:
          type: integer
        sys_bytes:
          type: integer
        num_cpu:
          type: integer
        recordings_dir:
          type: string
        recordings_dir_bytes:
          type: integer

    LoginRequest:
      type: object
      required: [ login_name, password ]
      properties:
        login_name:
          type: string
        password:
          type: string

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          default: Bearer
        must_change_password:
          type: boolean

    User:
      type: object
      properties:
        terminal_type:
          type: string
          enum: [ webrtc, sip ]
          description: SIP 终端只支持语音，修改绑定前必须签出
        sip_username:
          type: string
          description: SIP 终端须与 extension 相同，凭证由交换服务配置
        id:
          type: string
        username:
          type: string
          description: 页面展示用用户名
        login_name:
          type: string
          description: 本地登录名
        employee_no:
          type: string
          description: 工号
        role:
          type: string
          enum: [ admin, supervisor, agent ]
          description: 兼容旧客户端的初始角色；运行时授权请使用 roles 与 permissions
        roles:
          type: array
          items: { type: string }
        disabled:
          type: boolean
        must_change_password:
          type: boolean
        agent_id:
          type: string
        extension:
          type: string
        video_capable:
          type: boolean
        created_at:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'

    UserCreate:
      type: object
      required: [ username, login_name, employee_no, password ]
      properties:
        terminal_type:
          type: string
          enum: [ webrtc, sip ]
          description: SIP 终端只支持语音，修改绑定前必须签出
        sip_username:
          type: string
          description: SIP 终端须与 extension 相同，凭证由交换服务配置
        username:
          type: string
        login_name:
          type: string
        employee_no:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [ admin, supervisor, agent ]
          description: 兼容旧客户端；新建用户可改用 roles
        roles:
          type: array
          minItems: 1
          items: { type: string }
        extension:
          type: string
          description: role=agent 时必填
        video_capable:
          type: boolean

    UserUpdate:
      type: object
      properties:
        terminal_type:
          type: string
          enum: [ webrtc, sip ]
          description: SIP 终端只支持语音，修改绑定前必须签出
        sip_username:
          type: string
          description: SIP 终端须与 extension 相同，凭证由交换服务配置
        role:
          type: string
        username:
          type: string
        login_name:
          type: string
        employee_no:
          type: string
        extension:
          type: string
        video_capable:
          type: boolean
        disabled:
          type: boolean

    UserList:
      type: object
      properties:
        items:
          type: array
          items:
