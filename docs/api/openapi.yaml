components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    QueueId:
      name: queueId
      in: path
      required: true
      schema:
        type: string
    CallId:
      name: callId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LegId:
      name: legId
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BusinessError:
      description: 业务错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true

    StatusResponse:
      type: object
      properties:
        db_ok:
          type: boolean
        active_calls:
          type: integer
        ws_connections:
          type: integer
        goroutines:
          type: integer
        heap_alloc_bytes:
          type: integer
        sys_bytes:
          type: integer
        num_cpu:
          type: integer
        recordings_dir:
          type: string
        recordings_dir_bytes:
          type: integer

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          default: Bearer

    User:
      type: object
      properties:
        terminal_type:
          type: string
          enum: [webrtc, sip]
          description: SIP 终端只支持语音，修改绑定前必须签出
        sip_username:
          type: string
          description: SIP 终端须与 extension 相同，凭证由交换服务配置
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [admin, supervisor, agent]
        disabled:
          type: boolean
        agent_id:
          type: string
        extension:
          type: string
        video_capable:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [username, password, role]
      properties:
        terminal_type:
          type: string
          enum: [webrtc, sip]
          description: SIP 终端只支持语音，修改绑定前必须签出
        sip_username:
          type: string
          description: SIP 终端须与 extension 相同，凭证由交换服务配置
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, supervisor, agent]
        display_name:
          type: string
        extension:
          type: string
          description: role=agent 时必填
        video_capable:
          type: boolean

    UserUpdate:
      type: object
      properties:
        terminal_type:
          type: string
          enum: [webrtc, sip]
          description: SIP 终端只支持语音，修改绑定前必须签出
        sip_username:
          type: string
          description: SIP 终端须与 extension 相同，凭证由交换服务配置
        role:
          type: string
        disabled:
          type: boolean

    UserList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    Agent:
      type: object
      properties:
        terminal_type:
          type: string
          enum: [webrtc, sip]
          description: SIP 终端只支持语音，修改绑定前必须签出
        sip_username:
          type: string
          description: SIP 终端须与 extension 相同，凭证由交换服务配置
        id:
          type: string
        user_id:
          type: string
        extension:
          type: string
        video_capable:
          type: boolean
        skill_ids:
          type: array
          items:
            type: string

    AgentSession:
      type: object
      properties:
        agent_id:
          type: string
        state:
          $ref: "#/components/schemas/AgentState"
        busy_reason:
          type: string
        queue_ids:
          type: array
          items:
            type: string

    AgentState:
      type: string
      enum: [offline, idle, busy, ringing, on_call, acw]

    AgentStateUpdate:
      type: object
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/AgentState"
        busy_reason:
          type: string

    Queue:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        video_enabled:
          type: boolean
        max_wait_sec:
          type: integer
        strategy:
          type: string
          enum: [longest_idle, round_robin]
        overflow_policy:
          type: string
        overflow_queue_id:
          type: string
        recording_policy:
          type: string
          enum: [off, audio, video_composite]
        ivr_flow_id:
          type: string
        wait_prompt:
          type: string
        announce_recording:
          type: boolean
        priority_enabled:
          type: boolean

    QueueCreate:
      allOf:
        - $ref: "#/components/schemas/Queue"
      required: [name]

    QueueUpdate:
      type: object
      properties:
        name:
          type: string
        video_enabled:
          type: boolean
        max_wait_sec:
          type: integer

    QueueList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Queue"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    Skill:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    SkillCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string

    IVRFlow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        draft_config:
          type: object
          additionalProperties: true

    IVRFlowCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        draft_config:
          type: object

    IVRPublishedSnapshot:
      type: object
      properties:
        flow_id:
          type: string
        version:
          type: integer
        published_at:
          type: string
          format: date-time
        config:
          type: object

    GuestSessionCreate:
      type: object
      required: [queue_id]
      properties:
        queue_id:
          type: string
        ttl_sec:
          type: integer
        allowed_media:
          type: string
          enum: [audio, video]

    GuestSession:
      type: object
      properties:
        token:
          type: string
        guest_url:
          type: string
          description: 相对路径（如 /guest/?token=），根地址由调用方拼接
        expires_at:
          type: string
          format: date-time

    Call:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
        direction:
          type: string
          enum: [inbound, outbound, internal]
        session_type:
          type: string
          enum: [audio, video, mixed]
        queue_id:
          type: string
        agent_id:
          type: string
        legs:
          type: array
          items:
            $ref: "#/components/schemas/CallLeg"

    CallLeg:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
        agent_id:
          type: string

    GuestQueue:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        video_enabled:
          type: boolean

    GuestJoinRequest:
      type: object
      required: [queue_id]
      properties:
        queue_id:
          type: string
        session_type:
          type: string
          enum: [audio, video, mixed]
        token:
          type: string
        priority:
          type: integer
          description: VIP 优先级，队列开启 priority_enabled 时生效

    GuestJoinResponse:
      type: object
      properties:
        call_id:
          type: string
        token:
          type: string
        leg_id:
          type: string
        expires_at:
          type: string
          format: date-time

    OutboundCallRequest:
      type: object
      required: [destination]
      properties:
        destination:
          type: string
          description: 分机或 E.164

    TransferRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [blind, consult]
        target_agent_id:
          type: string
        target_queue_id:
          type: string

    SDPPayload:
      type: object
      properties:
        sdp:
          type: string
        type:
          type: string
          enum: [offer, answer]

    ICECandidate:
      type: object
      properties:
        candidate:
          type: string
        sdp_mid:
          type: string
        sdp_mline_index:
          type: integer

    TURNCredentials:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
        username:
          type: string
        credential:
          type: string
        ttl:
          type: integer

    CDR:
      type: object
      properties:
        call_id:
          type: string
        direction:
          type: string
        caller:
          type: string
        callee:
          type: string
        queue_id:
          type: string
        agent_id:
          type: string
        started_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_sec:
          type: integer
        wait_sec:
          type: integer
        result:
          type: string
        session_type:
          type: string
        recording_ids:
          type: array
          items:
            type: string

    CDRList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CDR"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    Recording:
      type: object
      properties:
        id:
          type: string
        call_id:
          type: string
        kind:
          type: string
          enum: [audio, video, composite]
        path:
          type: string
        retention_until:
          type: string
          format: date-time

    RecordingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recording"

    LiveReport:
      type: object
      properties:
        online_agents:
          type: integer
        active_calls:
          type: integer
        waiting_calls:
          type: integer

    HistoricalReport:
      type: object
      properties:
        answer_rate:
          type: number
        avg_wait_sec:
          type: number
        avg_talk_sec:
          type: number
        abandon_rate:
          type: number
        video_answer_rate:
          type: number

    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        event_filter:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    WebhookSubscriptionCreate:
      type: object
      required: [url, event_filter]
      properties:
        url:
          type: string
          format: uri
        secret:
          type: string
        event_filter:
          type: array
          items:
            type: string

    AuditLog:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        action:
          type: string
        resource:
          type: string
        created_at:
          type: string
          format: date-time
