openapi: 3.1.0
info:
  title: Open VoIP API
  version: 1.1.0
  description: |-
    内网呼叫中心 REST API。WebSocket 见 ../events.md。
    需求 ID 见各 operation 的 x-requirement-id。

    JSON 响应统一为 code/message/data/request_id，详见 response-contract.md。原 204 操作现在返回 200 和 data:null；下载、存活探针和 WebSocket 升级除外。
    所有时间戳使用 UTC 的 YYYY-MM-DD HH:MM:SS，例如 2026-09-25 10:12:35。
  license:
    name: Proprietary

servers:
  - url: https://cc.internal
    description: 内网示例

tags:
  - name: Auth
  - name: Users
  - name: Agents
  - name: Queues
  - name: Skills
  - name: IVR
  - name: Guest
  - name: Calls
  - name: MediaSignaling
  - name: CDR
  - name: Recordings
  - name: Reports
  - name: Webhooks
  - name: Config
  - name: Audit
  - name: Supervisor
  - name: Platform
  - name: AdminMaintenance
  - name: Observability

security:
  - bearerAuth: []

paths:
  /api/v1/agents/me/calls:
    get:
      tags: [ Agents ]
      summary: 当前坐席活跃通话快照（重连恢复）
      operationId: getMyActiveCalls
      responses:
        "200":
          description: items 中包含当前坐席所属的活跃通话
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                  request_id:
                    type: string
        "403":
          description: 当前用户不是坐席
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /health:
    get:
      tags: [ Platform ]
      security: []
      summary: 存活探针
      x-requirement-id: PLAT-06
      responses:
        "200":
          description: OK

  /health/ready:
    get:
      tags: [ Platform ]
      security: []
      summary: 就绪探针，检查 PostgreSQL 与 open-switch
      responses:
        "200":
          description: 依赖均可用
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: "null"
                  request_id:
                    type: string
        "503":
          description: 至少一个关键依赖不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/status:
    get:
      tags: [ Platform ]
      summary: 运行状态摘要
      x-requirement-id: PLAT-06,DEPLOY-08
      x-roles: [ admin, supervisor ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/StatusResponse"
                  request_id:
                    type: string

  /api/v1/auth/login:
    post:
      tags: [ Auth ]
      security: []
      summary: 登录
      x-requirement-id: PLAT-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TokenResponse"
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [ Auth ]
      security: []
      summary: 刷新 access token
      x-requirement-id: PLAT-02
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ refresh_token ]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TokenResponse"
                  request_id:
                    type: string

  /api/v1/auth/options:
    get:
      tags: [ Auth ]
      security: []
      summary: 查询 OIDC 是否启用
      responses:
        "200": { description: 登录方式，data 含 oidc_enabled }

  /api/v1/auth/oidc/start:
    get:
      tags: [ Auth ]
      security: []
      summary: 开始 OIDC 授权码登录
      responses:
        "302": { description: 跳转身份平台并设置 HttpOnly state Cookie }

  /api/v1/auth/oidc/callback:
    get:
      tags: [ Auth ]
      security: []
      summary: 验证 OIDC 回调并签发一次性票据
      responses:
        "302": { description: 跳转统一 Web 入口 /，票据仅位于 URL 片段 }

  /api/v1/auth/oidc/exchange:
    post:
      tags: [ Auth ]
      security: []
      summary: 使用一次性票据换取本项目令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ ticket ]
              properties:
                ticket: { type: string }
      responses:
        "200": { description: data 为 TokenResponse }

  /api/v1/auth/me:
    get:
      tags: [ Auth ]
      summary: 当前用户及有效角色、权限
      responses:
        "200": { description: data 含 user_id、agent_id、username、login_name、employee_no、roles、permissions }

  /api/v1/roles:
    get:
      tags: [ Users ]
      summary: 列出角色及其权限
      x-permission: roles.read
      responses:
        "200": { description: 角色列表 }

  /api/v1/roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [ Users ]
      summary: 创建或更新自定义角色
      x-permission: roles.write
      responses:
        "200": { description: 已保存 }
    delete:
      tags: [ Users ]
      summary: 删除自定义角色
      x-permission: roles.write
      responses:
        "200": { description: 已删除 }

  /api/v1/permissions:
    get:
      tags: [ Users ]
      summary: 权限目录
      x-permission: roles.read
      responses:
        "200": { description: 权限列表 }

  /api/v1/users/{userId}/roles:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [ Users ]
      x-permission: users.read
      responses:
        "200": { description: 用户角色列表 }
    put:
      tags: [ Users ]
      summary: 覆盖用户角色并撤销既有会话
      x-permission: users.update
      responses:
        "200": { description: 已保存 }

  /api/v1/users/{userId}/identities:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [ Users ]
      x-permission: identity.read
      responses:
        "200": { description: 外部身份绑定列表 }
    post:
      tags: [ Users ]
      summary: 按 issuer 与 sub 显式绑定既有用户
      x-permission: identity.write
      responses:
        "200": { description: 已绑定 }
    delete:
      tags: [ Users ]
      x-permission: identity.write
      responses:
        "200": { description: 已解绑 }

  /api/v1/identity/group-mappings:
    get:
      tags: [ Users ]
      x-permission: identity.read
      responses:
        "200": { description: 外部组到角色的映射 }
    put:
      tags: [ Users ]
      summary: 覆盖指定外部组的角色映射（组名可含斜线）
      x-permission: identity.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ group, roles ]
              properties:
                group: { type: string }
                roles:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: 已保存，既有 OIDC 会话撤销 }

  /api/v1/identity/group-mappings/{group}:
    put:
      tags: [ Users ]
      summary: 覆盖指定外部组的角色映射
      x-permission: identity.write
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已保存，既有 OIDC 会话撤销 }

  /api/v1/auth/logout:
    post:
      tags: [ Auth ]
      summary: 登出并撤销
      x-requirement-id: PLAT-02
      responses:
        "200":
          description: No content
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: "null"
                  request_id:
                    type: string

  /api/v1/users:
    get:
      tags: [ Users ]
      summary: 用户列表
      x-requirement-id: ADM-01
      x-roles: [ admin ]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/UserList"
                  request_id:
                    type: string
    post:
      tags: [ Users ]
      summary: 创建用户
      x-requirement-id: ADM-01,AGENT-01
      x-roles: [ admin ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
                  request_id:
                    type: string

  /api/v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [ Users ]
      x-roles: [ admin ]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
                  request_id:
                    type: string
    patch:
      tags: [ Users ]
      x-roles: [ admin ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
                  request_id:
                    type: string
    delete:
      tags: [ Users ]
      x-roles: [ admin ]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: "null"
                  request_id:
                    type: string

  /api/v1/users/{userId}/reset-password:
    post:
      tags: [ Users ]
      x-requirement-id: AGENT-01
      x-roles: [ admin ]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 新临时密码或邮件流程（实现定义）
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: "null"
                  request_id:
                    type: string

  /api/v1/agents/me:
    get:
      tags: [ Agents ]
      summary: 当前坐席资料
      x-roles: [ agent, supervisor, admin ]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Agent"
                  request_id:
                    type: string

  /api/v1/agents:
    get:
      tags: [ Agents ]
      summary: 坐席目录（转接/外呼）
      x-roles: [ agent, supervisor, admin ]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Agent"
                  request_id:
                    type: string

  /api/v1/agents/{agentId}/skills:
    get:
      tags: [ Skills ]
      x-requirement-id: AGENT-06
      x-roles: [ admin ]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: "null"
                  request_id:
                    type: string
    put:
      tags: [ Skills ]
      x-requirement-id: AGENT-06
      x-roles: [ admin ]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skill_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: "null"
                  request_id:
                    type: string

  /api/v1/agents/{agentId}/check-in:
    post:
      tags: [ Agents ]
      summary: 签入队列
      x-requirement-id: AGENT-02
      x-roles: [ agent ]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                queue_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/AgentSession"
                  request_id:
                    type: string

  /api/v1/agents/{agentId}/check-out:
    post:
      tags: [ Agents ]
      x-requirement-id: AGENT-02
      x-roles: [ agent ]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: "null"
                  request_id:
                    type: string

  /api/v1/agents/{agentId}/state:
    put:
      tags: [ Agents ]
      summary: 设置示闲/示忙等
      x-requirement-id: AGENT-03,AGENT-04
      x-roles: [ agent ]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentStateUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/AgentSession"
                  request_id:
                    type: string

  /api/v1/queues:
    get:
      tags: [ Queues ]
      x-requirement-id: ADM-01,QUEUE-01
      x-roles: [ admin, supervisor ]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/QueueList"
                  request_id:
                    type: string
    post:
      tags: [ Queues ]
      x-roles: [ admin ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Queue"
                  request_id:
                    type: string

  /api/v1/queues/{queueId}:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    get:
      tags: [ Queues ]
      x-roles: [ admin, supervisor, agent ]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Queue"
                  request_id:
                    type: string
    patch:
      tags: [ Queues ]
      x-roles: [ admin ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Queue"
                  request_id:
                    type: string
    delete:
      tags: [ Queues ]
      x-roles: [ admin ]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: "null"
                  request_id:
                    type: string

  /api/v1/queues/{queueId}/agents:
    put:
      tags: [ Queues ]
      summary: 绑定坐席
      x-roles: [ admin ]
      parameters:
        - $ref: "#/components/parameters/QueueId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: "null"
                  request_id:
                    type: string

  /api/v1/skills:
    get:
      tags: [ Skills ]
      x-requirement-id: AGENT-06,ADM-01
      x-roles: [ admin ]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
                  request_id:
                    type: string
    post:
      tags: [ Skills ]
      x-roles: [ admin ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Skill"
                  request_id:
                    type: string

  /api/v1/ivr/flows:
    get:
      tags: [ IVR ]
      x-requirement-id: ADM-02
      x-roles: [ admin ]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/IVRFlow"
                  request_id:
                    type: string
    post:
      tags: [ IVR ]
      x-roles: [ admin ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IVRFlowCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                  - request_id
                properties:
                  code:
                    type: string
