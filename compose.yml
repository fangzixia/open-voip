name: ${COMPOSE_PROJECT_NAME:-open-voip}

x-service: &service
  restart: unless-stopped
  init: true
  network_mode: host
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  open-switch:
    <<: *service
    image: ${GHCR_REGISTRY:-ghcr.io/fangzixia}/open-voip-open-switch:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: open-switch/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.27.1-bookworm}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    user: "${SWITCH_UID:-10001}:${SWITCH_GID:-10001}"
    volumes:
      - type: bind
        source: ${SWITCH_STATE_DIR:-./runtime/open-switch}
        target: /opt/open-switch
        bind:
          create_host_path: false
      - type: bind
        source: ${SWITCH_STATE_DIR:-./runtime/open-switch}/config.yml
        target: /opt/open-switch/config.yml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --max-time 3 "$${HEALTH_URL}" >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    environment:
      TZ: Asia/Hong_Kong
      HEALTH_URL: ${SWITCH_HEALTH_URL:-http://127.0.0.1:8082/health}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  open-call:
    <<: *service
    image: ${GHCR_REGISTRY:-ghcr.io/fangzixia}/open-voip-open-call:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: open-call/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.27.1-bookworm}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    user: "${CALL_UID:-10001}:${CALL_GID:-10001}"
    volumes:
      - type: bind
        source: ${CALL_STATE_DIR:-./runtime/open-call}
        target: /opt/open-call
        bind:
          create_host_path: false
      - type: bind
        source: ${CALL_STATE_DIR:-./runtime/open-call}/config.yml
        target: /opt/open-call/config.yml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      open-switch:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --max-time 3 "$${HEALTH_URL}" >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    environment:
      TZ: Asia/Hong_Kong
      HEALTH_URL: ${CALL_HEALTH_URL:-http://127.0.0.1:8080/health/ready}

  web:
    <<: *service
    profiles: ["with-web"]
    image: open-voip/web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: open-call-web/Dockerfile
    depends_on:
      open-call:
        condition: service_healthy
    environment:
      TZ: Asia/Hong_Kong
      WEB_LISTEN: ${WEB_LISTEN:-0.0.0.0:8088}
      CALL_HTTP_UPSTREAM: ${CALL_HTTP_UPSTREAM:-127.0.0.1:8080}
      WEB_HEALTH_URL: ${WEB_HEALTH_URL:-http://127.0.0.1:8088/container-health}
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --max-time 3 "$${WEB_HEALTH_URL}" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 6
